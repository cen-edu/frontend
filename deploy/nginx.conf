# 이 컨테이너가 서비스의 유일한 입구다. 정적 파일을 서빙하면서 /api 는 백엔드로 넘긴다.
# 브라우저가 보는 오리진이 하나(http://<EIP>)로 합쳐지므로 CORS 설정이 필요 없다.
#
# backend 는 compose 네트워크의 서비스 이름이다. EC2 사설 IP 를 박지 않는다 —
# 인스턴스를 새로 만들 때마다 이미지를 다시 빌드해야 하기 때문이다.

upstream cen_edu_backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 문항·답안 이미지 업로드가 5MB 까지 허용된다(백엔드 spring.servlet.multipart).
    # nginx 기본값 1m 이면 스프링에 닿기도 전에 413 이 난다.
    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://cen_edu_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 채점·문항 생성은 백엔드에서 비동기로 돌아 요청 자체는 짧다. 다만 보고서 PDF
        # 렌더링과 집계 조회는 동기라 길어질 수 있어 기본 60초보다 여유를 둔다.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 배포 확인용. EC2 밖에서 앱이 살아 있는지 보는 유일한 경로다.
    location = /actuator/health {
        proxy_pass http://cen_edu_backend;
        proxy_set_header Host $host;
    }

    # Swagger 는 운영에서 닫는다. 열어 두면 인증 없이 전체 API 목록과 스키마가 공개된다.
    # 백엔드도 prod 프로파일에서 끄지만(SWAGGER_ENABLED), 입구에서도 막아 둔다.
    location ~ ^/(swagger-ui|v3/api-docs) {
        deny all;
    }

    # 해시가 붙은 번들은 내용이 바뀌면 파일 이름이 바뀐다. 오래 캐시해도 안전하다.
    # expires 와 add_header 를 함께 쓰면 Cache-Control 이 두 줄로 나간다. 한쪽만 쓴다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html 은 캐시하지 않는다. 캐시되면 배포 후에도 브라우저가 옛 번들을 계속 가리킨다.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React Router 는 클라이언트 라우팅이다. /teacher/... 로 새로고침하면 그 경로의
    # 파일이 없어 404 가 나므로 index.html 로 넘긴다(vercel.json 의 rewrites 와 같은 역할).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
