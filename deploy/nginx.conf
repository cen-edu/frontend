# 정적 파일만 서빙한다. API 프록시는 앞단 nginx 가 /api 를 백엔드로 보낸다 —
# 프론트가 보는 오리진과 API 오리진이 같아지므로 CORS 설정이 필요 없다.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 해시가 붙은 번들은 내용이 바뀌면 파일 이름이 바뀐다. 오래 캐시해도 안전하다.
    # expires 와 add_header 를 함께 쓰면 Cache-Control 이 두 줄로 나간다. 한쪽만 쓴다.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html 은 캐시하지 않는다. 캐시되면 배포 후에도 브라우저가 옛 번들을 계속 가리킨다.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React Router 는 클라이언트 라우팅이다. /teacher/... 로 새로고침하면 그 경로의
    # 파일이 없어 404 가 나므로 index.html 로 넘긴다(vercel.json 의 rewrites 와 같은 역할).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
